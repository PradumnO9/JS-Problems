<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Currying</title>
</head>
<body>
    <script>
        let multiply = function(x, y) {
            console.log(x * y);
        }

        let multiplyByTwo = multiply.bind(this, 2); // 2 acts as value of x
        let multiplyByThree = multiply.bind(this, 3, 5); // x = 3 and y = 5
        multiplyByTwo(6); // 12
        multiplyByThree(3); // 15

        // using clouser
        let addition = function(a) {
            return function(b) {
                console.log(a + b);
            }
        }

        let add = addition(2); // a = 2
        console.log(add)
        add(3); // b = 3 => 5

    </script>
</body>
</html>
